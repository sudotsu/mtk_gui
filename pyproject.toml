[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtk-gui"
version = "0.1.0"
description = "Standalone GUI for mtkclient"
license = "GPL-3.0-only"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5",
    "pyserial>=3.5",
    "mtkclient @ git+https://github.com/bkerler/mtkclient.git@7cb40e727727dfe3faa065eefb29b16ed29bbdf1",
]

[project.scripts]
mtk-gui = "mtk_gui.app:main"

[tool.setuptools.packages.find]
include = ["mtk_gui*"]
